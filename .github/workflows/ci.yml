name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  verify:
    name: Application verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify solver and package
        run: npm run verify
      - name: Verify unified web app
        run: |
          npm run lint -w @fleetpilot/web
          npm run typecheck -w @fleetpilot/web
          npm run build -w @fleetpilot/web
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Generate SPDX SBOM
        run: npm run sbom
      - name: Verify npm package contents
        run: npm pack --dry-run
      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: |
            dist/
            sbom.spdx.json
          retention-days: 30

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t fleetpilot:test .
      - name: Smoke-test unified app
        run: |
          docker run --rm -d \
            --name fleetpilot-smoke \
            -p 3000:3000 \
            fleetpilot:test
          trap 'docker logs fleetpilot-smoke || true; docker rm -f fleetpilot-smoke >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/overview > /tmp/overview.html; then
              ready=true
              break
            fi
            sleep 1
          done

          test "$ready" = true
          test -s /tmp/overview.html
      - name: Enforce image size budget
        run: |
          bytes=$(docker image inspect fleetpilot:test --format '{{.Size}}')
          echo "Image size: $(numfmt --to=iec "$bytes")"
          test "$bytes" -lt 314572800
