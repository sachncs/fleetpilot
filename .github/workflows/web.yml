name: Unified web app

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck console
        run: npm run typecheck -w @fleetpilot/web
      - name: Lint console
        run: npm run lint -w @fleetpilot/web
      - name: Build solver and unified web app
        run: npm run build:frontend
